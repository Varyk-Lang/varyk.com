base_url = "https://varyk.com"
title = "Varyk"
author = "Vlad Mickevic"
description = "An experimental programming language for backend services, with Rust-like safety and Go-like simplicity. It compiles to Rust."

compile_sass = false
minify_html = false
generate_sitemap = true
generate_robots_txt = true
# Site-wide feed off; the blog section turns its own feed on.
generate_feeds = false
feed_filenames = ["atom.xml"]

# Zola 0.23 cannot switch highlighting off. Class-based output with the theme
# stylesheet left unlinked renders code as plain text, and the small Varyk
# grammar keeps `data-lang="varyk"` on Varyk blocks instead of "plain".
[markdown.highlighting]
style = "class"
theme = "github-light"
extra_grammars = ["syntaxes/varyk.json"]

[extra]
# Site-wide copy used by the templates. Values are Markdown, rendered inline.
repository = "https://github.com/Varyk-Lang/varyk"
notice = "**Experimental.** Varyk is pre-1.0: syntax, diagnostic codes, and command-line flags may still change, and a breaking change bumps the minor version."
tagline = "Rust’s safety. Go’s *simplicity.*"
contact = "Discussion happens in the [issues](https://github.com/Varyk-Lang/varyk/issues). Write to [hello@varyk.com](mailto:hello@varyk.com); security reports go to [security@varyk.com](mailto:security@varyk.com)."

