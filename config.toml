base_url = "https://varyk.com"
title = "Varyk"
description = "An experimental systems programming language with Rust-like safety and Go-like simplicity. It compiles to Rust."

compile_sass = false
minify_html = false
generate_sitemap = true
generate_robots_txt = true
# Site-wide feed off; the blog section turns its own feed on.
generate_feeds = false
feed_filenames = ["atom.xml"]

# Zola 0.23 cannot switch highlighting off. Class-based output with the theme
# stylesheet left unlinked renders code as plain text, and the small Varyk
# grammar keeps `data-lang="varyk"` on Varyk blocks instead of "plain".
[markdown.highlighting]
style = "class"
theme = "github-light"
extra_grammars = ["syntaxes/varyk.json"]

