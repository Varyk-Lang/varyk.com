{% extends "base.html" %}
{% block content %}
<h1>{{ section.title }}</h1>
{{ section.content | safe }}
{%- if section.pages %}
<ul class="pages">
{%- for p in section.pages %}
  <li><a href="{{ p.path }}">{{ p.title }}</a>{% if p.description %}<p>{{ p.description }}</p>{% endif %}</li>
{%- endfor %}
</ul>
{%- endif %}
{% endblock content %}
