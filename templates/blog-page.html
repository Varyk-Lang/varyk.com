{% extends "base.html" %}
{% block content %}
<div class="wrap doc">
<h1>{{ page.title }}</h1>
<p class="meta"><time datetime="{{ page.date }}">{{ page.date | date(format="%-d %B %Y") }}</time> · by <a href="https://github.com/vlamic">{{ config.author }}</a></p>
{{ page.content | safe }}
</div>
{% endblock content %}
